name: 3 Oaks catalogue CI
on:
  push:
    branches: [fix/three-oaks-validation]
    paths:
      - 'tester_spin/providers/three_oaks/**'
      - 'tests/test*three_oaks*.py'
      - 'tests/fixtures/three_oaks*'
      - '.github/workflows/three-oaks-catalogue-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: three-oaks-validation
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
      TESTER_SPIN_PUBLISH_RESULTS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies and retain exact source
        run: |
          mkdir -p action-three-oaks
          git archive --format=zip HEAD > action-three-oaks/source.zip
          python -m pip install --disable-pip-version-check -r requirements-dev.txt pytest-subtests PyYAML
      - name: Complete repository regression suite
        continue-on-error: true
        timeout-minutes: 5
        run: xvfb-run -a python -m pytest tests -q --junitxml=action-three-oaks/full-suite.xml
      - name: Mandatory 3 Oaks regression gate
        run: |
          mapfile -t tests < <(find tests -name 'test*three_oaks*.py' | sort)
          test "${#tests[@]}" -gt 0
          python -m pytest -q "${tests[@]}" --junitxml=action-three-oaks/three-oaks-tests.xml
      - name: Prepare demo network tools
        timeout-minutes: 3
        run: |
          if ! command -v wg-quick >/dev/null || ! command -v resolvconf >/dev/null; then
            sudo timeout -k 5 90 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -y -qq install wireguard-tools resolvconf
          fi
      - name: Validate catalogue inside bounded demo tunnel
        timeout-minutes: 20
        env:
          PROTON_WG_CONF_B64: ${{ secrets.PROTON_WG_CONF_B64 }}
        run: |
          set -euo pipefail
          cleanup() {
            sudo timeout -k 5 15 wg-quick down proton >/dev/null 2>&1 || true
            sudo rm -f /etc/wireguard/proton.conf
            rm -f "$RUNNER_TEMP/proton-three-oaks.conf"
          }
          trap cleanup EXIT INT TERM
          if [ -n "${PROTON_WG_CONF_B64:-}" ]; then
            umask 077
            printf '%s' "$PROTON_WG_CONF_B64" | base64 --decode > "$RUNNER_TEMP/proton-three-oaks.conf"
            sudo install -m 600 "$RUNNER_TEMP/proton-three-oaks.conf" /etc/wireguard/proton.conf
            rm -f "$RUNNER_TEMP/proton-three-oaks.conf"
            sudo timeout -k 5 30 wg-quick up proton >/dev/null
            curl --fail --silent --show-error --max-time 20 -4 https://api.ipify.org >/dev/null
            test "$(sudo wg show proton latest-handshakes | awk '{print $2}' | sort -nr | head -1)" -gt 0
          fi
          timeout -k 5 1050 python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          workflow=yaml.safe_load(Path('.github/workflows/three-oaks-validation.yml').read_text())
          shell=next(s['run'] for s in workflow['jobs']['validate']['steps'] if s.get('name')=='Inventory catalogue and validate selected fresh demos')
          prefix="python - <<'PY'\n"
          assert shell.startswith(prefix) and shell.endswith('PY\n')
          script=shell[len(prefix):-3]
          before="if result.status != 'OK' and (gd/'client.js').is_file():"
          after="if (result.status != 'OK' or any(m.get('kind')=='DISCOVERED_ONLY' for m in result.discovered_modes)) and (gd/'client.js').is_file():"
          assert script.count(before)==1
          script=script.replace(before,after).replace('> 780', '> 990')
          exec(compile(script,'three-oaks-current-catalogue','exec'),{'__name__':'__main__'})
          target=Path('action-three-oaks/summary.json')
          summary=json.loads(target.read_text())
          for case in summary['cases']:
              case['coverage_complete']=case['status']=='OK' and case['discovered_only']==0 and not case['pending_modes'] and all(r.get('status')=='CONFIRMED' for r in case['return_checks'])
          summary['coverage_complete_size']=sum(c['coverage_complete'] for c in summary['cases'])
          summary['purchases_validated']=sum(c['purchase_validated'] for c in summary['cases'])
          target.write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - name: Remove tunnel and credentials
        if: always()
        run: |
          sudo wg-quick down proton >/dev/null 2>&1 || true
          sudo rm -f /etc/wireguard/proton.conf
          rm -f "$RUNNER_TEMP/proton-three-oaks.conf"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-oaks-validated-${{ github.run_id }}
          path: action-three-oaks/
          retention-days: 7
