name: 3 Oaks local Windows launcher offline checks

on:
  push:
    branches: [ci/three-oaks-complete-sweep]
    paths:
      - 'tools/three_oaks_full_sweep.py'
      - 'scripts/Run-3Oaks-Local.cmd'
      - 'tests/test_three_oaks_full_sweep_cli.py'
      - '.github/workflows/three-oaks-local-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt pytest-subtests
      - name: Compile all local-runner code
        run: python -m compileall -q tester_spin tools/three_oaks_full_sweep.py tests/test_three_oaks_full_sweep_cli.py
      - name: Run local runner tests and all regressions (offline only)
        run: xvfb-run -a python -m pytest tests -q --junitxml=offline-results.xml
